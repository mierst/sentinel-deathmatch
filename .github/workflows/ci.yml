name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    name: Static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static gates
        run: bash tools/ci/checks.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: no PBO-build or in-engine compile job. The packer proves nothing
  # about in-engine compilation, and the DayZ server cannot run in CI. The
  # authoritative compile gate is a local dedicated-server boot with all
  # [DM] fixture lines PASS - required in every PR (see CONTRIBUTING.md).
