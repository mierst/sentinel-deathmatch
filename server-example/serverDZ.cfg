// Sentinel Deathmatch - example server config
// Copy to the server root and edit the hostname at minimum.

hostname = "My Sentinel Deathmatch Server [ALPHA]";
password = "";
passwordAdmin = "CHANGE_ME";

maxPlayers = 40;

// Signature verification against keys\*.bikey. Keep at 2 for public
// servers; 0 only for LAN development.
verifySignatures = 2;
forceSameBuild = 1;

// Deathmatch servers are usually first-person-only. Set 0 to allow 3PP.
disable3rdPerson = 1;

// Vanilla respawn delay; align with RespawnDelaySeconds in
// profile\SentinelDeathmatch\config.json.
respawnTime = 2;

disableVoN = 0;
vonCodecQuality = 20;

serverTime = "2020/1/1/12/00";
serverTimeAcceleration = 0;
serverNightTimeAcceleration = 1;
serverTimePersistent = 0;

guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
instanceId = 1;
storageAutoFix = 1;

// --- Arena network tuning ------------------------------------------------
// Small arenas mean every player is inside every other player's network
// bubble by design. simulatedPlayersBatch can go to ~30 on a strong CPU.
// networkRangeFar may be reduced toward (largest zone diameter x 1.5) to
// save bandwidth, but NEVER below any zone's diameter - players would stop
// replicating to each other across the arena.
simulatedPlayersBatch = 30;
// networkRangeClose = 20;
// networkRangeNear = 150;
// networkRangeFar = 1000;
// networkRangeDistantEffect = 4000;

class Missions
{
	class DayZ
	{
		template = "dayzOffline.deathmatch.chernarusplus";
	};
};
